<!DOCTYPE HTML>
<html>
<head>
  <title>ily ૮₍ ˶ᵔ ᵕ ᵔ˶ ₎ა</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background-image: url('kitty.gif');
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh; 
      margin: 0;
    }

    p {
      text-align: center;
      font-size: 60px;
      font-family: "Comic Sans MS", cursive;
      color: #FCB1C9;
      margin: 0;
    }
  </style>
</head>
<body>

<audio id="bgMusic" autoplay loop>
  <source src="yamama.mp3" type="audio/mpeg">
</audio>

<p id="demo"></p>

<script>
// Set the date we're counting down to
var countDownDate = new Date("June 22, 2027 00:00:00").getTime();

// Update the count down every 1 second
var x = setInterval(function() {
  // Get today's date and time
  var now = new Date().getTime();
  
  // Find the distance between now and the count down date
  var distance = countDownDate - now;
  
  // Time calculations for days, hours, minutes and seconds
  var days = Math.floor(distance / (1000 * 60 * 60 * 24));
  var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  var seconds = Math.floor((distance % (1000 * 60)) / 1000);
  
  document.getElementById("demo").innerHTML = days + "d " + hours + "h " + minutes + "m " + seconds + "s ";
  
  if (distance < 0) {
    clearInterval(x);
    document.getElementById("demo").innerHTML = "happy birthday i love you <3";
  }
}, 1000);

window.addEventListener("load", function() {
  var music = document.getElementById("bgMusic");
  
  music.play().catch(function() {
    document.addEventListener("click", function() {
      music.play();
    }, { once: true });
  });
});
</script>

</body>
</html>
